<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciudadanía digital en la era de la Inteligencia Artificial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #26282E;
      color: #FBF9F5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Work Sans", sans-serif;
      overflow: hidden;
      position: relative;
    }
    .bg-photo {
      position: fixed;
      inset: -24px;
      z-index: 0;
      background: url("../images/fondo-inicio.png") center / cover no-repeat;
      filter: blur(7px) saturate(.75);
      transform: scale(1.1);
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(25, 28, 34, .72);
    }
    .loader {
      position: relative;
      z-index: 2;
      width: min(64vmin, 340px);
      height: min(64vmin, 340px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .6s ease, transform .6s ease;
    }
    .loader.done { opacity: 0; transform: scale(.85); pointer-events: none; }
    .ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: #F0E0CE;
      stroke-width: 10;
    }
    .ring-bar {
      fill: none;
      stroke: #A4693B;
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset .1s linear;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .percent {
      font-weight: 800;
      font-size: clamp(44px, 11vmin, 64px);
      letter-spacing: -.03em;
      color: #FBF9F5;
    }
    .label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: #C9B79B;
    }
    .spinner {
      position: absolute;
      inset: 14px;
      border: 3px solid transparent;
      border-top-color: #D98E5F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.skip {
      position: fixed;
      bottom: 18px;
      z-index: 3;
      color: #C9B79B;
      font-size: 13px;
      text-decoration: underline;
    }
    .options {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 720px;
      padding: 24px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .options.show { opacity: 1; transform: translateY(0); }
    .options-kicker {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: #C9B79B;
      margin-bottom: 14px;
    }
    .options h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(26px, 5vmin, 42px);
      line-height: 1.06;
      letter-spacing: -.02em;
      font-weight: 700;
      color: #FBF9F5;
      margin-bottom: 8px;
    }
    .options p.sub {
      font-size: 16px;
      color: #C9B79B;
      margin-bottom: 34px;
    }
    .choices {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: clamp(210px, 26vmin, 260px);
      padding: 30px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .06);
      color: #FBF9F5;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
    }
    .choice:hover {
      transform: translateY(-5px);
      background: rgba(164, 105, 59, .28);
      border-color: rgba(217, 142, 95, .7);
    }
    .choice svg { width: 42px; height: 42px; stroke: #D98E5F; }
    .choice strong {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.01em;
    }
    .choice span {
      font-size: 13px;
      color: #C9B79B;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="bg-photo" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="Cargando la presentación">
    <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
      <circle class="ring-track" cx="80" cy="80" r="74"></circle>
      <circle class="ring-bar" id="bar" cx="80" cy="80" r="74"></circle>
    </svg>
    <div class="spinner" aria-hidden="true"></div>
    <div class="center">
      <span class="percent" id="percent">0%</span>
      <span class="label">Cargando</span>
    </div>
  </div>
  <div class="options" id="options">
    <span class="options-kicker">Bienvenido</span>
    <h1>¿Cómo quieres ver la presentación?</h1>
    <p class="sub">Ciudadanía digital en la era de la Inteligencia Artificial</p>
    <div class="choices">
      <a class="choice" href="pagina-1.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        <strong>Modo lectura</strong>
        <span>Recorrer el contenido diapositiva por diapositiva</span>
      </a>
      <a class="choice" href="video.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="14" rx="2"></rect>
          <path d="M10 9l5 3-5 3z"></path>
        </svg>
        <strong>Ver webinar</strong>
        <span>Ver el video completo de la sesión</span>
      </a>
    </div>
  </div>
  <a class="skip" href="pagina-1.html">Abrir directamente</a>
  <script>
    (function () {
      var circle = document.getElementById("bar");
      var pctEl = document.getElementById("percent");
      var loader = document.getElementById("loader");
      var options = document.getElementById("options");
      var R = 74;
      var C = 2 * Math.PI * R;
      var DURATION = 5000;
      var STEP = 100;
      var start = Date.now();
      var last = 0;
      circle.style.strokeDasharray = C;
      circle.style.strokeDashoffset = C;
      function update(p) {
        last = p;
        circle.style.strokeDashoffset = C * (1 - p / 100);
        pctEl.textContent = Math.round(p) + "%";
      }
      function tick() {
        var elapsed = Date.now() - start;
        if (elapsed >= DURATION) {
          update(100);
          setTimeout(finish, 350);
          return;
        }
        var t = elapsed / DURATION;
        var eased = 100 * (0.04 + 0.96 * t * (2 - t));
        var wobble = Math.random() * 7 - 3.5;
        var target = Math.min(100, Math.max(eased + wobble, eased - 4));
        var cur = Math.min(100, Math.max(last + 1, Math.round(target)));
        update(cur);
        setTimeout(tick, STEP);
      }
      function finish() {
        loader.classList.add("done");
        options.classList.add("show");
      }
      update(1 + Math.floor(Math.random() * 6));
      setTimeout(tick, STEP);
    })();
  </script>
</body>
</html>
